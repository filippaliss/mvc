imports:
    - php

filter:
    excluded_paths: [vendor/*, tests/*, tools/*, node_modules/*, docs/*, public/build/*, '*.phar']

build:
    image: default-bionic

    nodes:
        my-tests:
            environment:
                php:
                    version: 8.3.3
                    # version: 8.1.13
                    # version: 8.1.17
                    # version: 8.2.4
        analysis:
            tests:
                override:
                    - php-scrutinizer-run
                    #- phpcs-run # Not used, missing config file
    tests:
        override:
            -   command: "XDEBUG_MODE=coverage composer phpunit"
                coverage:
                    file: "docs/coverage.clover"
                    format: "php-clover"

checks:
    php:
        code_rating: true
        duplication: true
        security_vulnerabilities: true
